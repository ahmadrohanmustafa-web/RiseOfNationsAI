name: Build Rise of Nations (Minecraft 26.3)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      # Compiles the mod AND runs the game-logic tests. Any failure stops the build.
      - name: Build and test
        run: gradle build --no-daemon --stacktrace

      - name: Check the JAR really contains the mod
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Checking $JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json' || { echo "fabric.mod.json missing"; exit 1; }
          CLASSES=$(unzip -l "$JAR" | grep -c '\.class')
          echo "Compiled classes in JAR: $CLASSES"
          [ "$CLASSES" -gt 10 ] || { echo "Too few classes in JAR"; exit 1; }
          unzip -p "$JAR" fabric.mod.json
          cp "$JAR" "RiseOfNationsAI-Minecraft-26.3.jar"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RiseOfNationsAI-Minecraft-26.3
          path: RiseOfNationsAI-Minecraft-26.3.jar
          if-no-files-found: error
